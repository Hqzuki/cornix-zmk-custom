name: Tests (no UF2)
run-name: "テスト（UF2なし） · ${{ github.ref_name }}"
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  transport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify PAW3222 GPIO turnaround and register protocol
        run: |
          cc -std=c11 -Wall -Wextra -Werror tests/corex/wire_test.c -o /tmp/corex-wire-test
          /tmp/corex-wire-test
      - name: Verify shared LED timing and priorities
        run: |
          cc -std=c11 -Wall -Wextra -Werror tests/corex/status_test.c -o /tmp/corex-status-test
          /tmp/corex-status-test
          python3 tests/corex/led_dispatch_test.py
      - name: Verify unified PAN direction and layer references
        run: |
          python3 tests/corex/keymap_checks.py
          python3 tests/corex/pan_direction_test.py
      - name: Verify WIN/MAC window key routing and release
        run: python3 tests/corex/os_key_test.py
      - name: Verify pure stock Cornix layout and hardware isolation
        run: python3 tests/corex/stock_cornix_test.py
      - name: Verify automatic Bluetooth OS detection without persistence
        run: python3 tests/corex/auto_os_test.py
