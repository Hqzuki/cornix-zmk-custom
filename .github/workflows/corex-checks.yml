name: CoreX transport checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  transport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify PAW3222 GPIO turnaround and register protocol
        run: |
          cc -std=c11 -Wall -Wextra -Werror tests/corex/wire_test.c -o /tmp/corex-wire-test
          /tmp/corex-wire-test
      - name: Verify shared LED timing and priorities
        run: |
          cc -std=c11 -Wall -Wextra -Werror tests/corex/status_test.c -o /tmp/corex-status-test
          /tmp/corex-status-test
      - name: Verify unified PAN direction and layer references
        run: python3 tests/corex/pan_direction_test.py
      - name: Verify WIN/MAC window key routing and release
        run: python3 tests/corex/os_key_test.py
      - name: Verify default-layer endpoint routing and persistence
        run: |
          cc -std=c11 -Wall -Wextra -Werror tests/corex/endpoint_policy_test.c -o /tmp/corex-endpoint-test
          /tmp/corex-endpoint-test
          python3 tests/corex/default_layer_test.py
