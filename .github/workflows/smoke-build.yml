# Scheduled smoke build — issue #1 対策案2.
#
# config/west.yml と build.yml は ZMK・モジュールを commit SHA に固定している。
# この workflow は固定した構成のまま定期的に build.yaml の全ターゲットをビルドし、
# 外部要因（Docker イメージや GitHub 側の変更など）で壊れていないかを確認する。
# ZMK を上げるときは west.yml と両 workflow の SHA を同時に更新する。
#
# 注意:
#  - cron は UTC。`0 0 * * 1` = 毎週月曜 00:00 UTC = 09:00 JST。
#  - スケジュール実行は **デフォルトブランチ (main) 上の定義のみ** 発火する。
#    この file が main にマージされて初めて週次実行が始まる。
#  - GitHub は 60 日間 repo 活動がないとスケジュール workflow を自動停止する。
#    停止された場合は Actions タブから手動再有効化、または workflow_dispatch。
name: Smoke build (scheduled)
on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@4dd95d7840eb3d5a3f59bb29fbf1ab054715ef85
